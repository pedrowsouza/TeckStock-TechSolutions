
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolutions</title>
</head>
<body>
    <div class="container">

        <header>
            <h1>🧰 TechStock 🧰</h1>
            <p>Sistema de controle de materiais</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <h3>Total de materiais</h3>
                <h2 id="total">0</h2>
            </div>

            <div class="card">
                <h3>Disponíveis</h3>
                <h2 id="disponiveis">0</h2>
            </div>

            <div class="card">
                <h3>Emprestados</h3>
                <h2 id="emprestados">0</h2>
            </div>
        </section>

        <section class="formulario">
            <h2>Cadastrar material</h2>

            <form id="formMaterial">
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do material"
                    required
                >

                <input
                    type="text"
                    id="categoria"
                    placeholder="Categoria"
                >

                <input
                    type="text"
                    id="patrimonio"
                    placeholder="Numero de serie"
                    required
                >

                <select id="status">
                    <option value="Disponivel">Disponível</option>
                    <option value="Emprestado">Emprestado</option>
                </select>

                <input
                    type="text"
                    id="funcionario"
                    placeholder="Funcionário responsável"
                >

                <button type="submit">
                    Cadastrar material
                </button>
            </form>
        </section>

        <section class="lista">
            <h2>Lista de materiais</h2>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Numero de serie</th>
                            <th>Status</th>
                            <th>Responsável</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabelaMateriais"></tbody>
                </table>
            </div>

            <div class="paginacao">
                <button id="anterior" type="button">
                    ← Anterior
                </button>

                <span id="infoPagina">Página 1 de 1</span>

                <button id="proxima" type="button">
                    Próxima →
                </button>
            </div>
        </section>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
